# Local Loki stack: Loki + Promtail + Grafana + a JSON log generator.
# Everything is free and local. Tear down with:  docker compose down -v
#
#   Loki     -> http://localhost:3100
#   Grafana  -> http://localhost:3000  (anonymous admin, no login)

services:
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"] # the image's working default
    ports:
      - "3100:3100"

  log-generator:
    image: python:3.12-slim
    command: ["python", "/app/log-generator.py"]
    volumes:
      - applogs:/var/log/app
      - ./log-generator.py:/app/log-generator.py:ro

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - applogs:/var/log/app:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
    depends_on:
      - loki
      - log-generator

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki

volumes:
  applogs: {}
