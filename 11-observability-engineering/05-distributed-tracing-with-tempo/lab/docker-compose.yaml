# Correlated traces + logs stack for the Tempo lab. All local and free.
# Tear down with:  docker compose down -v
#
#   Grafana -> http://localhost:3000  (anonymous admin; Explore has Tempo + Loki)

services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml:ro

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]

  trace-log-generator:
    image: python:3.12-slim
    command: ["python", "/app/trace-log-generator.py"]
    volumes:
      - applogs:/var/log/app
      - ./trace-log-generator.py:/app/trace-log-generator.py:ro
    depends_on:
      - tempo

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - applogs:/var/log/app:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
    depends_on:
      - loki
      - trace-log-generator

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - tempo
      - loki

volumes:
  applogs: {}
