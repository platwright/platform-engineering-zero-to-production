# Promtail: tail the generator's log file and push to Loki. Only `level` becomes a
# label; `trace_id` stays IN the line so (a) Loki cardinality stays flat and (b) the
# Grafana derived field can extract it to build the log -> trace link.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          service: checkout
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
