apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example-app
  labels:
    app.kubernetes.io/name: prometheus-example-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-example-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-example-app
    spec:
      containers:
        - name: app
          # Serves 200 on "/", 404 on "/err"; exposes http_requests_total (counter)
          # and http_request_duration_seconds (histogram) at /metrics.
          image: quay.io/brancz/prometheus-example-app:v0.3.0
          ports:
            - name: web
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example-app
  labels:
    app.kubernetes.io/name: prometheus-example-app
spec:
  selector:
    app.kubernetes.io/name: prometheus-example-app
  ports:
    - name: web # the ServiceMonitor references this port BY NAME
      port: 8080
      targetPort: web
