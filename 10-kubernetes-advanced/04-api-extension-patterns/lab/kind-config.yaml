# kind cluster for the API-extension lab. CRD field selectors (selectableFields)
# are beta and on by default in 1.31, so pin a 1.31 node.
# Create with: kind create cluster --name pe-apiext --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pe-apiext
nodes:
  - role: control-plane
    image: kindest/node:v1.31.2
