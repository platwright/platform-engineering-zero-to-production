# kind cluster for the admission lab. ValidatingAdmissionPolicy is GA in 1.30,
# so pin a recent node image.
# Create with: kind create cluster --name pe-admission --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pe-admission
nodes:
  - role: control-plane
    image: kindest/node:v1.31.2
