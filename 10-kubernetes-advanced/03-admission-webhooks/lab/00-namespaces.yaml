# A managed team namespace (the label makes admission policies/webhooks target it)
# carrying the team and cost-center as ANNOTATIONS — the webhook reads these and
# injects them as Pod LABELS. This is what the Module 10.2 operator stamps for you.
apiVersion: v1
kind: Namespace
metadata:
  name: team-payments
  labels:
    platform.example.com/managed-by: namespace-provisioner
  annotations:
    platform.example.com/team: payments
    platform.example.com/cost-center: cc-1001
---
# An UNMANAGED namespace (no managed-by label): the policy and webhook must NOT
# fire here, proving the namespaceSelector scoping works.
apiVersion: v1
kind: Namespace
metadata:
  name: team-unmanaged
