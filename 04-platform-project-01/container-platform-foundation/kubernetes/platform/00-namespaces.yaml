# Namespaces for the Container Platform Foundation.
# Team namespaces enforce the "restricted" Pod Security Standard, so unhardened
# pods are rejected at admission — a structural guardrail you get for free,
# before Kyverno is introduced in Phase 13.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    platform.example.com/team: platform
    platform.example.com/environment: dev
    # Platform operators may need slightly more than "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    platform.example.com/team: team-a
    platform.example.com/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
  labels:
    platform.example.com/team: team-b
    platform.example.com/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
