# Total resource budget per team namespace. One team cannot consume the whole
# cluster: the sum of all their pods' requests/limits is capped here, along with
# object counts. Exceeding any of these blocks the offending create/update.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    services.loadbalancers: "2"
    persistentvolumeclaims: "10"
    count/deployments.apps: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-b
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    services.loadbalancers: "2"
    persistentvolumeclaims: "10"
    count/deployments.apps: "20"
