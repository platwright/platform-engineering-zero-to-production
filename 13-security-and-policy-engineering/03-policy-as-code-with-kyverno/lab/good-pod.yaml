# COMPLIANT pod — satisfies the whole baseline, for the lab.
# Non-root at the pod level, CPU/memory requests + memory limit, a pinned image
# tag, and ownership labels. This is admitted in both Audit and Enforce modes.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  labels:
    team: platform
    app.kubernetes.io/name: good-pod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          memory: "32Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
