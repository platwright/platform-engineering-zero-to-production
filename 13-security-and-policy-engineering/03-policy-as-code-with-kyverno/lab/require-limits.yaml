# Require resource requests and limits.
# Every container must declare CPU and memory requests and limits so the scheduler
# can place it and a noisy neighbour cannot starve the node (see Module 03.7).
# Ships in Audit; the lab patches it to Enforce.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Workload Management
    policies.kyverno.io/description: >-
      Requires CPU/memory requests and memory limits on all containers.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "CPU/memory requests and a memory limit are required on every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
