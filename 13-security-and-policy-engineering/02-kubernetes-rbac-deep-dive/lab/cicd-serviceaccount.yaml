# cicd-serviceaccount.yaml — a least-privilege CI/CD identity.
#
# cicd-deployer can deploy WITHIN the team-apps namespace only: manage Deployments,
# ReplicaSets, Pods, Services, and ConfigMaps. It deliberately CANNOT read Secrets,
# delete namespaces, or touch any other namespace — so a leaked token is contained to
# a single namespace. Never give a pipeline cluster-admin or a ClusterRoleBinding.
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-deployer
  namespace: team-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-deploy
  namespace: team-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deployer-binding
  namespace: team-apps
subjects:
  - kind: ServiceAccount
    name: cicd-deployer
    namespace: team-apps
roleRef:
  kind: Role
  name: cicd-deploy
  apiGroup: rbac.authorization.k8s.io
