# secret-store.yaml — ESO SecretStore pointing at the in-cluster Vault *dev* server.
#
# DEV-ONLY: this authenticates with Vault's root token stored in a K8s Secret
# (vault-token). NEVER commit a real token, and never use token auth in production — use
# the Kubernetes auth method (see vault-setup.sh) so pods authenticate by identity.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-dev
  namespace: my-app
spec:
  provider:
    vault:
      # In-cluster address of the Vault dev service (namespace "vault").
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"          # KV mount path; ExternalSecret keys are relative to this
      version: "v2"           # KV v2 engine (versioned secrets)
      auth:
        tokenSecretRef:
          name: "vault-token" # K8s Secret holding the dev root token (dev-only!)
          key: "token"
