# Loki Helm values — single-binary, filesystem storage, laptop-sized. Production uses
# object storage (GCS) and the scalable/distributed mode — see architecture.md.
#
# helm repo add grafana https://grafana.github.io/helm-charts
# helm install loki grafana/loki -n observability -f loki-values.yaml
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h # short local retention; GCS long-term in Pass 2
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
# Disable the extra components not needed in single-binary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
