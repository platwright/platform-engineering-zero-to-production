# Pass 2 — Alertmanager routing: send platform alerts to Slack, with pages and
# tickets routed differently. The Slack webhook is a SECRET and must come from a
# secret manager (ESO), never be committed here. This is a reference shape.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: observability
stringData:
  # In Pass 2 this whole config is templated by the Prometheus Operator and the
  # Slack webhook URL is injected from GCP Secret Manager via ESO (never in Git).
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-tickets
      group_by: ['alertname', 'category']
      routes:
        - matchers:
            - severity = "page"
          receiver: slack-pages
          continue: false
        - matchers:
            - severity = "ticket"
          receiver: slack-tickets
    receivers:
      - name: slack-pages
        slack_configs:
          - channel: "#platform-pages"
            api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: "{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook_url }}"
      - name: slack-tickets
        slack_configs:
          - channel: "#platform-alerts"
            api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
