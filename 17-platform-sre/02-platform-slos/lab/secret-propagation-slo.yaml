# Sloth PrometheusServiceLevel — Secret propagation (External Secrets Operator)
#
# Platform SLO: 95% of ESO sync calls succeed, over 30 days. Freshness ("within
# 10 minutes of a source change") is enforced by the ExternalSecret
# `refreshInterval: 10m`; this SLO guarantees those scheduled syncs actually land,
# so a team's apps start with valid, current credentials.
#
# "good" = successful ESO sync calls; "bad" = errored sync calls.
# ESO exposes externalsecret_sync_calls_total and externalsecret_sync_calls_error.
#
# Render with:
#   docker run --rm -v "${PWD}:/data" ghcr.io/slok/sloth:v0.16.0 \
#     generate -i /data/secret-propagation-slo.yaml -o /data/secret-propagation-rules.yaml
version: "prometheus/v1"
service: external-secrets
labels:
  tier: platform
  owner: platform-team
slos:
  - name: secret-propagation-success
    objective: 95.0
    description: >-
      95% of External Secrets Operator syncs succeed, so secrets stay fresh within
      the 10-minute refresh window.
    sli:
      events:
        error_query: sum(rate(externalsecret_sync_calls_error[{{.window}}]))
        total_query: sum(rate(externalsecret_sync_calls_total[{{.window}}]))
    alerting:
      name: SecretPropagation
      labels:
        service: external-secrets
      annotations:
        summary: Secret propagation is burning its error budget; syncs are failing.
        runbook: https://runbooks.internal.example.com/secret-propagation
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
