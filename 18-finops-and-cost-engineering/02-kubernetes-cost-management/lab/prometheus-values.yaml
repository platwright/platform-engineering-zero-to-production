# Prometheus Helm values for the OpenCost lab (prometheus-community/prometheus).
# Keeps the install light for kind and adds a scrape job so Prometheus collects
# OpenCost's cost metrics from the opencost service on port 9003.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
  retention: 2d

extraScrapeConfigs: |
  - job_name: opencost
    honor_labels: true
    scrape_interval: 1m
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    dns_sd_configs:
      - names:
          - opencost.opencost.svc.cluster.local
        type: 'A'
        port: 9003
