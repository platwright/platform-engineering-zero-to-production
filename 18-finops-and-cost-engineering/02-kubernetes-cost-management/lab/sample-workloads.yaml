# Tenant workloads for the OpenCost lab.
# Three namespaces with deliberately different request profiles so OpenCost has an
# interesting allocation to show:
#   team-web   - realistic, right-sized web services (moderate requests, real traffic)
#   team-batch - OVER-PROVISIONED and idle: large requests, does nothing (sleep)
#   team-cache - small, steady
# Every workload sets requests, so none are BestEffort and all are attributable.
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-web
  labels:
    team: web
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-batch
  labels:
    team: batch
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-cache
  labels:
    team: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: team-web
  labels:
    app.kubernetes.io/name: storefront
    team: web
    cost-lab: finops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        team: web
        cost-lab: finops
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: team-web
  labels:
    app.kubernetes.io/name: checkout-api
    team: web
    cost-lab: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        team: web
        cost-lab: finops
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightly-report
  namespace: team-batch
  labels:
    app.kubernetes.io/name: nightly-report
    team: batch
    cost-lab: finops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nightly-report
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightly-report
        team: batch
        cost-lab: finops
    spec:
      containers:
        # Requests a whole core and a gig, then does nothing. This is the classic
        # over-provisioned/idle workload: expensive by request, ~0 usage.
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: team-cache
  labels:
    app.kubernetes.io/name: session-cache
    team: cache
    cost-lab: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-cache
        team: cache
        cost-lab: finops
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
