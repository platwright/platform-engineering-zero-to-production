# Scale-to-zero for a non-prod namespace.
# Dev/staging/preview environments have no reason to run nights and weekends (~2/3 of
# the week). This file creates:
#   - a `dev` namespace with two sample deployments
#   - a least-privilege `scaler` ServiceAccount allowed only to scale Deployments in dev
#   - two CronJobs: scale-down-dev (20:00 weekdays) and scale-up-dev (08:00 weekdays)
# Trigger them on demand with:  kubectl -n dev create job --from=cronjob/scale-down-dev now
#
# NOTE: scale-up restores a flat 1 replica for simplicity. A production version stores
# each deployment's original replica count (e.g. in an annotation) and restores that.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    platform.example.com/environment: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-app-1
  namespace: dev
  labels:
    app.kubernetes.io/name: dev-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-app-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-app-1
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-app-2
  namespace: dev
  labels:
    app.kubernetes.io/name: dev-app-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-app-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-app-2
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-scaler
  namespace: dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-can-scale
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: scaler
    namespace: dev
roleRef:
  kind: Role
  name: deployment-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-dev
  namespace: dev
spec:
  schedule: "0 20 * * 1-5"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: scaler
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:1.30
              command:
                - /bin/sh
                - -c
                - kubectl scale deployment --all --replicas=0 -n dev
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-up-dev
  namespace: dev
spec:
  schedule: "0 8 * * 1-5"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: scaler
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:1.30
              command:
                - /bin/sh
                - -c
                - kubectl scale deployment --all --replicas=1 -n dev
