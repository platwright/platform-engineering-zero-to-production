# Karpenter spot + consolidation NodePool — CLOUD-ONLY STARTER (e.g. AWS EKS).
#
# This is the production pattern for the last two rungs of the optimization ladder:
#   - capacity-type "spot"  -> 60-90% cheaper nodes for interruptible work
#   - consolidationPolicy    -> actively re-pack pods onto fewer, fuller nodes
#
# It does NOT apply to kind: kind nodes are fixed Docker containers, so no provisioner
# can add or remove them. Use this on a real cluster that already has Karpenter
# installed. Replace every <PLACEHOLDER> and the "CLUSTER_NAME" tags before applying.
#
# Workloads opt in to spot by tolerating the taint and selecting the label, so only
# interruptible jobs land here — never stateful or singleton-critical services:
#   spec:
#     nodeSelector: { billing-model: spot }
#     tolerations:
#       - key: billing-model
#         value: spot
#         effect: NoSchedule
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  template:
    metadata:
      labels:
        billing-model: spot
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
      taints:
        - key: billing-model
          value: spot
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  # Active consolidation: the pattern that turns right-sizing into fewer nodes.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: "100"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "KarpenterNodeRole-<CLUSTER_NAME>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<CLUSTER_NAME>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<CLUSTER_NAME>"
  amiSelectorTerms:
    - alias: al2023@latest
