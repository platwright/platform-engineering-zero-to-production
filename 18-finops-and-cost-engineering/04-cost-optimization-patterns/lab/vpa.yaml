spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inflated-3
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
