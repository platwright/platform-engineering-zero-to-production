name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  schedule:
    # Weekly, Monday 06:00 UTC — catches external "Further reading" links that rot.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --offline validates relative/internal file links and anchors without
      # hitting the network, which keeps CI fast and stable. External links are
      # covered by the weekly scheduled run below.
      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path "shared/templates" "./**/*.md"
          fail: true

      # On the weekly schedule, also verify external links (best-effort).
      - name: Check external links (scheduled, non-blocking)
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 --exclude-path "shared/templates" "./**/*.md"
          fail: false
