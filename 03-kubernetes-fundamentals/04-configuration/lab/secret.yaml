# A Secret stores sensitive config. stringData takes plain text and Kubernetes
# base64-encodes it for you. IMPORTANT: base64 is ENCODING, not encryption — this
# value is only as safe as the RBAC on the Secret and etcd encryption-at-rest.
# The value below is an obvious placeholder; never commit a real credential.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  API_TOKEN: "demo-not-a-real-secret"
