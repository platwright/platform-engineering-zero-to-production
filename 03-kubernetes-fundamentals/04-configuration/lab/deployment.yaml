# A workload that consumes config three ways:
#   - LOG_LEVEL        as a single env var (valueFrom.configMapKeyRef) — FROZEN at start
#   - the whole Secret as env vars (envFrom.secretRef)
#   - app.conf         as a mounted file (volume) — can HOT-RELOAD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
  labels:
    app: config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
          envFrom:
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: app-config
