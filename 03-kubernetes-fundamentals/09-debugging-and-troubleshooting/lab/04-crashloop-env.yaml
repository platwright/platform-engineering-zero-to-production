# BROKEN — Failure 4: CrashLoopBackOff.
# Symptom: the Pod restarts over and over; current logs look empty because the
# container dies immediately.
# Diagnose:
#   kubectl logs deploy/worker --previous   # FATAL: REQUIRED_TOKEN environment variable is not set
# The entrypoint requires REQUIRED_TOKEN and exits 1 when it is missing.
# Fix: provide the required env var, then re-apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    lab: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$REQUIRED_TOKEN" ]; then
                echo "FATAL: REQUIRED_TOKEN environment variable is not set" >&2
                exit 1
              fi
              echo "worker started"; sleep 3600
