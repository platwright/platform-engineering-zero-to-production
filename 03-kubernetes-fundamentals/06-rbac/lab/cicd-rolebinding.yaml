# Grants the deploy-manager Role to the cicd-deployer ServiceAccount, IN my-app.
# Because this is a RoleBinding (not a ClusterRoleBinding), the grant applies only
# in the my-app namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deployer-binding
  namespace: my-app
subjects:
  - kind: ServiceAccount
    name: cicd-deployer
    namespace: my-app
roleRef:
  kind: Role
  name: deploy-manager
  apiGroup: rbac.authorization.k8s.io
