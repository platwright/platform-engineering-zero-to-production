# A StatefulSet whose volumeClaimTemplate creates ONE PVC per replica
# (data-datastore-0, data-datastore-1). Each Pod always reattaches to its own
# volume by stable name, even after being deleted and rescheduled.
apiVersion: v1
kind: Service
metadata:
  name: datastore
  labels:
    app: datastore
spec:
  clusterIP: None
  selector:
    app: datastore
  ports:
    - name: dummy
      port: 9999
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datastore
spec:
  serviceName: datastore
  replicas: 2
  selector:
    matchLabels:
      app: datastore
  template:
    metadata:
      labels:
        app: datastore
    spec:
      containers:
        - name: store
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
