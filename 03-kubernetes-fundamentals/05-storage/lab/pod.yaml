# A Pod that mounts the demo-data PVC at /data. The container filesystem is
# ephemeral, but anything written under /data lives on the bound PersistentVolume
# and survives this Pod being deleted.
apiVersion: v1
kind: Pod
metadata:
  name: writer
  labels:
    app: writer
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-data
