# SKETCH / ILLUSTRATIVE — one of two Compositions that back the XObjectStorage XRD.
# This one implements the bucket on AWS with S3 managed resources (Upbound provider-aws).
# Patches are simplified for teaching; modern Crossplane prefers composition functions
# (e.g. function-patch-and-transform). Do not treat this as apply-ready.
#
# LEAK-AUDIT HINTS (compare with the GCP version): S3 bucket names are globally unique and
# have their own charset rules; public access is a SEPARATE resource; versioning is a
# SEPARATE resource; storage classes and lifecycle rules use AWS-specific names.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: objectstorage-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XObjectStorage
  resources:
    - name: s3-bucket
      base:
        apiVersion: s3.aws.upbound.io/v1beta1
        kind: Bucket
        spec:
          forProvider:
            region: us-east-1          # patched from spec.region via a region map
      patches:
        - fromFieldPath: spec.region
          toFieldPath: spec.forProvider.region
        - fromFieldPath: metadata.uid
          toFieldPath: status.bucketName
          policy:
            fromFieldPath: Optional
    - name: s3-versioning
      base:
        apiVersion: s3.aws.upbound.io/v1beta1
        kind: BucketVersioning
        spec:
          forProvider:
            region: us-east-1
            bucketSelector:
              matchControllerRef: true
            versioningConfiguration:
              - status: Suspended       # patched to Enabled when spec.versioned is true
      patches:
        - fromFieldPath: spec.region
          toFieldPath: spec.forProvider.region
        - fromFieldPath: spec.versioned
          toFieldPath: spec.forProvider.versioningConfiguration[0].status
          transforms:
            - type: map
              map:
                "true": Enabled
                "false": Suspended
    - name: s3-public-access-block
      base:
        # On AWS, blocking public access is its OWN resource — a leak vs GCP's model.
        apiVersion: s3.aws.upbound.io/v1beta1
        kind: BucketPublicAccessBlock
        spec:
          forProvider:
            region: us-east-1
            bucketSelector:
              matchControllerRef: true
            blockPublicAcls: true
            blockPublicPolicy: true
            ignorePublicAcls: true
            restrictPublicBuckets: true
      patches:
        - fromFieldPath: spec.region
          toFieldPath: spec.forProvider.region
