# REFERENCE ClusterClass for the Docker (CAPD) provider — read this to understand what
# `clusterctl generate cluster pe-dev --flavor development` produces and applies for you.
#
# A ClusterClass is authored ONCE by the platform team. It bundles the templates for the
# control plane, workers, and infrastructure, so each actual cluster becomes a tiny
# `Cluster` with a `spec.topology` (see workload-cluster.yaml). This is the paved road for
# clusters themselves — the cluster-level equivalent of a Deployment template.
#
# NOTE ON VERSIONS: Cluster API moves fast and the development flavor also ships variables
# and patches (image repositories, etcd tags, etc.) omitted here for readability. The
# guaranteed, version-matched manifests come from `clusterctl generate`. Treat this file as
# a faithful map of the shape, and prefer the clusterctl output when applying.
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: quick-start
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: quick-start-control-plane
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        name: quick-start-control-plane
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: DockerClusterTemplate
      name: quick-start-cluster
  workers:
    machineDeployments:
      - class: default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfigTemplate
              name: quick-start-default-worker-bootstraptemplate
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: DockerMachineTemplate
              name: quick-start-default-worker-machinetemplate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerClusterTemplate
metadata:
  name: quick-start-cluster
spec:
  template:
    spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: quick-start-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            # Docker runs the API server behind a load-balancer container; allow these SANs.
            certSANs:
              - localhost
              - 127.0.0.1
              - 0.0.0.0
              - host.docker.internal
          controllerManager:
            extraArgs:
              enable-hostpath-provisioner: "true"
        initConfiguration:
          nodeRegistration:
            # The Docker provider needs eviction thresholds relaxed for its containers.
            kubeletExtraArgs:
              eviction-hard: "nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%"
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              eviction-hard: "nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: quick-start-control-plane
spec:
  template:
    spec:
      extraMounts:
        - containerPath: /var/run/docker.sock
          hostPath: /var/run/docker.sock
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: quick-start-default-worker-machinetemplate
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: quick-start-default-worker-bootstraptemplate
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            eviction-hard: "nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%"
