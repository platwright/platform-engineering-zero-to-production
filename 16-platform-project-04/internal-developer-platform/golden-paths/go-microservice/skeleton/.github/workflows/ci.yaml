# The golden-path CI pipeline, baked into every scaffolded service (Phase 5 /
# Project 1). build -> scan (Trivy) -> sign (Cosign, keyless) -> push by digest.
# Pin actions by SHA in a real repo; tags are used here for readability.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing via OIDC

env:
  IMAGE: ghcr.io/your-org/${{ values.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:ci
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sign (keyless)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign by digest
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
