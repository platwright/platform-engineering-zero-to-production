# A SecretStore tells ESO HOW to reach a backend and HOW to authenticate.
# This one targets the in-cluster dev Vault using token auth. The token itself is
# the single secret you bootstrap out-of-band (here, a Secret named vault-token).
# This file is safe to commit: it contains a reference, not a secret value.
#
# In production, use workload identity or a least-privilege token — never root.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: web
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"          # KV v2 mount (dev mode mounts it at secret/)
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token   # a Secret you create with the Vault token
          key: token
