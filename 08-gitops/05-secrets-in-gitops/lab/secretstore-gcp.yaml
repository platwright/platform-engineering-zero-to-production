# OPTIONAL — cloud backend example. NOT used by the free local lab.
#
# This shows how little changes to point ESO at a managed secret store instead of
# the local dev Vault: swap the SecretStore's provider. The ExternalSecret stays
# almost identical — only remoteRef.key changes to the cloud secret's name. Using a
# cloud backend requires a cloud account and is the only part of this module that
# could incur cost, so it is left as a reference, not a lab step.
#
# Prefer Workload Identity (shown) over static service-account keys — no secret to
# store, and the binding is auditable.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-backend
  namespace: web
spec:
  provider:
    gcpsm:
      projectID: my-gcp-project
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: my-cluster
          serviceAccountRef:
            name: eso-sa
---
# The matching ExternalSecret differs only in which backend and key it references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-db
  namespace: web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-backend
    kind: SecretStore
  target:
    name: web-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        # A Secret Manager secret named "web-database-url" in the project above.
        key: web-database-url
