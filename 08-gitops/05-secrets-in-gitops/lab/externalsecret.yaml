# An ExternalSecret is a POINTER, not a secret — safe to commit and sync with Argo CD.
# ESO reads the referenced value from the backend and materializes a native
# Kubernetes Secret named `web-db`, refreshing it every refreshInterval.
#
#   kubectl -n web get externalsecret web-db     # STATUS should reach SecretSynced
#   kubectl -n web get secret web-db              # the materialized Secret appears
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-db
  namespace: web
spec:
  refreshInterval: 15s          # short for the lab; use minutes/hours in production
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-db                # the Kubernetes Secret ESO will create and own
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL   # key in the resulting Kubernetes Secret
      remoteRef:
        key: web                # entry in the backend (secret/web under KV v2)
        property: database-url  # field within that entry
