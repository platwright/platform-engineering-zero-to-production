apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD: customer-facing. Runs the PROMOTED image at 3 replicas.
# This overlay is gated behind a MANUAL sync in Argo CD (see argocd/web-prod.yaml).
namespace: web-prod

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: replicas-patch.yaml

images:
  - name: nginx
    newTag: 1.27.0-alpine
