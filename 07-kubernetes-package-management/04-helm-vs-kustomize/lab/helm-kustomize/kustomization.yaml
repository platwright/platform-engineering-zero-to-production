apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# COMBINE both tools: Helm renders the base into rendered.yaml (you generate it with
# `helm template` in the lab), and Kustomize patches the environment deltas on top —
# no chart fork, no extra chart values. This is the pattern Argo CD supports natively.
resources:
  - rendered.yaml

patches:
  - path: prod-patch.yaml
    target:
      kind: Deployment
      name: web
